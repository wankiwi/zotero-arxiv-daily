name: Test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated tests or read-only OpenReview authentication validation
        type: choice
        options: [tests, openreview]
        default: tests
permissions:
  contents: read
jobs:
  isolated-tests:
    if: ${{ inputs.mode != 'openreview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run isolated tests without delivery credentials
        run: uv run --frozen pytest
  openreview-validation:
    if: ${{ inputs.mode == 'openreview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Validate official login and public submissions only
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: uv run --frozen python scripts/validate_openreview.py
