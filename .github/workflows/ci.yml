name: CI
on:
  workflow_dispatch:
    inputs:
      model_test:
        description: Also download the embedding model and run the slow test
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen zot2dailypaper --help
      - run: uv run --frozen pytest --cov=src/zot2dailypaper --cov-report=term-missing
  model-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.model_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m slow
